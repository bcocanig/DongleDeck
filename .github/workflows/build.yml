name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Protocol, lock, and Jabra tests
        shell: powershell
        run: ./build.ps1 -Test
      - name: Build single-file portable package
        shell: powershell
        run: ./build.ps1 -Package
      - name: Inspect dist output
        shell: powershell
        run: Get-ChildItem -Path dist -Recurse | Format-Table FullName, Length -AutoSize
      - name: Smoke-test published single-file EXE startup
        shell: powershell
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist\DongleDeck.exe') -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          $logPath = Join-Path $env:LOCALAPPDATA 'DongleDeck\dongledeck.log'
          if (Test-Path $logPath) { Get-Content $logPath }
          if ($p.ExitCode -ne 0) { throw "Published EXE self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: DongleDeckPrime-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $assets = @(
            (Get-Item 'dist\DongleDeck.exe').FullName
          ) + @(Get-Item 'dist\*.zip' | ForEach-Object { $_.FullName }) + @(Get-Item 'dist\*.sha256' | ForEach-Object { $_.FullName })
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $repo
          } else {
            gh release create $tag @assets --title "DongleDeck Prime $tag" --generate-notes --repo $repo
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release for $tag" }
