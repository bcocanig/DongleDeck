name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Protocol tests (simulated hardware)
        shell: powershell
        run: ./test.ps1
      - name: Build portable package
        shell: powershell
        run: ./pack.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DongleDeck-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
